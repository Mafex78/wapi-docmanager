<!DOCTYPE html>
<html lang="it" data-bs-theme="light">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
        Pagina host del client Blazor WebAssembly.
        Ordine obbligato: script inline del tema, poi bootstrap.min.css, poi app.css (sovrascrive Bootstrap);
        in fondo al body js/app.js (window.wapiPreferences, usato già in Program.cs) prima di blazor.webassembly.js.
        Gli attributi lang e data-bs-theme di html vengono aggiornati a runtime (AppCultures, ThemeToggle).
        Bootstrap è incluso solo come CSS (nessun bootstrap.js): modali e menu sono gestiti dai componenti Blazor.
    -->
    <title>WAPIDocManager</title>
    <base href="/" />
    <script>
        // Applica il tema salvato (o quello di sistema) prima del render per evitare il flash
        (function () {
            var theme = null;
            try { theme = window.localStorage.getItem('wapidocmanager.theme'); } catch (e) { }
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="lib/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Si è verificato un errore imprevisto / An unexpected error occurred.
        <a href="" class="reload">Ricarica / Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
