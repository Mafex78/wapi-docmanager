# Configurazione nginx per il client Blazor WebAssembly (copiata in /etc/nginx/conf.d/default.conf dal Dockerfile).

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # MIME dei file WebAssembly: senza questo il browser rifiuta di istanziare il modulo.
    # Le versioni recenti di nginx lo hanno già in mime.types, la riga vale come garanzia.
    types {
        application/wasm wasm;
    }
    include /etc/nginx/mime.types;

    # I file dell'app (.wasm e .dll) pesano parecchio: la compressione riduce di molto il primo caricamento.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/wasm application/octet-stream;

    # Instradamento di una SPA: le route del client (/documents, /login, ...) non sono file su disco,
    # quindi ogni percorso sconosciuto deve restituire index.html e lasciare che sia il router di Blazor a decidere.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Manifest di avvio e configurazione: mai dalla cache, altrimenti dopo un aggiornamento il browser
    # carica un elenco di file non più coerente (blazor.boot.json ha i controlli di integrità) o vecchi indirizzi API.
    location /_framework/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /appsettings.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
